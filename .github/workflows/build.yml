name: Build desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # rpmbuild isn't preinstalled on ubuntu-latest — electron-builder's rpm
      # target shells out to it and fails outright without this.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Without this, electron-builder searches the runner's keychain for a
      # code-signing certificate on macOS and fails outright when it finds
      # none, instead of falling back to an unsigned build.
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Unsigned builds: Windows shows an "unknown publisher" SmartScreen
      # warning and macOS needs a right-click-Open to bypass Gatekeeper,
      # until a code-signing certificate is added to this workflow.
      # dist/latest*.yml (latest.yml / latest-mac.yml / latest-linux.yml) and
      # *.blockmap are the electron-updater update-feed metadata — without
      # them the in-app self-update check (main/autoUpdate.ts) can't find
      # or verify new releases. Deliberately NOT dist/*.yml: that also
      # matches electron-builder's own builder-debug.yml, which every matrix
      # job produces with the same filename — all three colliding on the
      # same release asset name breaks the release step (seen in v0.7.0).
      - uses: actions/upload-artifact@v4
        with:
          name: apitab-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  # Installers are too large for git (GitHub's 100MB per-file limit), so
  # tagged builds publish here instead — apitab-server's landing page links
  # directly to these release asset URLs.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history + tags — needed to diff against the previous release,
      # unlike the build job's default shallow checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo commits feat:/fix:/build: directly to master (see commit
      # log) rather than through PRs, so action-gh-release's own
      # generate_release_notes (which summarizes merged PRs) had nothing to
      # summarize and only ever emitted the compare-link footer. Build the
      # "What's Changed" list from commit subjects since the previous tag
      # instead — surfaced in-app as What's New (see main/autoUpdate.ts).
      - name: Generate release notes
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${GITHUB_REF_NAME}$" | tail -1)
          {
            echo "## What's Changed"
            if [ "$PREV_TAG" != "$GITHUB_REF_NAME" ] && [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..$GITHUB_REF_NAME" --pretty=format:'%s' --no-merges | grep -Ev '^Bump version to ' | sed 's/^/- /'
            else
              git log --pretty=format:'%s' --no-merges | grep -Ev '^Bump version to ' | sed 's/^/- /'
            fi
            if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_REF_NAME" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-notes.md

      # Enqueues a release-announcement email to every verified, subscribed
      # user (apitab-server sends them a few minutes apart on a cron tick,
      # not all at once — see that repo's SendPendingReleaseEmails). Never
      # fails the run: the actual release above already succeeded by this
      # point, and that's the part that matters if this one call flakes.
      - name: Notify apitab-server of the new release
        continue-on-error: true
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: |
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --rawfile notes release-notes.md \
            '{version: $version, url: $url, notes: $notes}' \
          | curl -sf -X POST "https://apitab.duckdns.org/api/releases/notify" \
              -H "X-Release-Secret: $RELEASE_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @-
