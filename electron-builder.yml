appId: com.apitab.desktop
productName: ApiTab
directories:
  buildResources: build
  output: dist
# Consistent filenames across platforms (mac/linux targets otherwise
# default to inconsistent templates — some use productName, some use name).
artifactName: ${name}-${version}.${ext}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json,yarn.lock}'
  - '!{README.md,CHANGELOG.md}'
asarUnpack:
  - resources/**
# Linux-only (see the script's own comment) — swaps the real Electron binary
# for a tiny wrapper that sets ELECTRON_DISABLE_SANDBOX before exec'ing it,
# since none of our four Linux targets ever fix the bundled chrome-sandbox
# helper's permissions and Electron aborts before any window opens without
# this (GitHub issue #10).
afterPack: scripts/afterPackLinuxSandbox.cjs
# Lets electron-updater (main/autoUpdate.ts) know where to check for new
# releases. Public repo, so no token is needed at update-check time; CI still
# publishes releases itself via softprops/action-gh-release (see build.yml).
publish:
  provider: github
  owner: AponAhmed
  repo: apitab-desktop
win:
  executableName: apitab-desktop
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
  notarize: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Development
  # electron-builder requires this for deb/rpm; falls back to package.json's
  # author otherwise, but that's "Name (parenthetical)" — not a valid
  # maintainer string, so dpkg-deb / rpmbuild would reject it.
  maintainer: Muhiminul Haque <apon2041@gmail.com>
npmRebuild: false
